name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Windows Defender
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OCIO via vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install opencolorio:x64-windows
      - name: Build
        env:
          OCIO_INSTALL_DIR: ${{ github.workspace }}\vcpkg\installed\x64-windows
        run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: rvalt-windows
          path: target/x86_64-pc-windows-msvc/release/rvalt.exe

  macos:
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install OCIO
        run: brew install opencolorio
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: rvalt-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rvalt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OCIO
        run: sudo apt-get update && sudo apt-get install -y libopencolorio-dev
      - name: Build
        env:
          OCIO_INSTALL_DIR: /usr
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: rvalt-linux
          path: target/x86_64-unknown-linux-gnu/release/rvalt
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
